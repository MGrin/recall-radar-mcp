# The hackathon demo video, rendered with the studio's media toolkit (passive-income
# tools/media/walkthrough.py). Each distinct url is loaded ONCE against a running server and
# asks its `q` for real: with MODEL_PROVIDER=openai that is one live model run per url, and
# live recall data. Re-check every spoken fact against the frames after each render.
#
# The questions are entered from the page address (?q=), not by microphone, and the narrator
# is a local text-to-speech voice. The narration says so.

[video]
base = "http://127.0.0.1:58640"
title = "Recall Radar"
end = "grishin.studio"
voice = "af_heart"
theme = "dark"
viewport = [1280, 1040]

[[shot]]
url = "/?mute=1&tall=1"
say = "Recalls for products, food and medicine come out every week, from different agencies. Almost nobody checks them. Recall Radar lets a home assistant do it."
focus = ".answer"

[[shot]]
url = "/?mute=1&tall=1&q=Watch%20my%20crib%20mattress%20and%20my%20ibuprofen"
say = "I ask it to watch two things I own. The model calls the watchlist tool twice, on our own MCP server."
speak = "I ask it to watch two things I own. The model calls the watchlist tool twice, on our own M C P server."
focus = "#trace"

[[shot]]
url = "/?mute=1&tall=1&q=Watch%20my%20crib%20mattress%20and%20my%20ibuprofen"
say = "Both are now on a household watchlist, kept on this machine."
focus = "#watchlist"

[[shot]]
url = "/?mute=1&tall=1&q=Has%20anything%20in%20my%20house%20been%20recalled%3F"
say = "Then the question that matters: has anything in my house been recalled? One tool call checks every watched item against live public data."
focus = "#reply"

[[shot]]
url = "/?mute=1&tall=1&q=Has%20anything%20in%20my%20house%20been%20recalled%3F"
say = "It found a real recall of crib mattresses, from the US Consumer Product Safety Commission. The card shows the date, the hazard, the remedy and a link to the official notice."
focus = "#cards"

[[shot]]
url = "/?mute=1&tall=1&q=Has%20anything%20in%20my%20house%20been%20recalled%3F"
say = "The spoken answer stays short. The detail, and the proof, stay on the card, so a person can check the product and the lot before doing anything."
focus = "#cards .card"

[[shot]]
url = "/?mute=1&tall=1&q=Is%20there%20a%20recall%20on%20peanut%20butter%3F"
say = "The same server covers food. Asking about peanut butter returns FDA enforcement records, each with its date and its source."
speak = "The same server covers food. Asking about peanut butter returns F D A enforcement records, each with its date and its source."
focus = "#cards"

[[shot]]
url = "/?mute=1&tall=1&q=Is%20ibuprofen%20recalled%20or%20short%3F"
say = "And medicine. One tool searches FDA drug recalls and European Medicines Agency shortages together. For a medicine, the answer says to ask a pharmacist or doctor before changing anything."
speak = "And medicine. One tool searches F D A drug recalls and European Medicines Agency shortages together. For a medicine, the answer says to ask a pharmacist or doctor before changing anything."
focus = ".answer"

[[shot]]
url = "/?mute=1&tall=1&q=Is%20ibuprofen%20recalled%20or%20short%3F"
say = "If one source is down, the others still answer, and the reply says which one was missing."
focus = "#cards"

[[shot]]
url = "/?mute=1&tall=1&q=Has%20anything%20in%20my%20house%20been%20recalled%3F"
say = "Behind the screen is a self-hosted MCP server: protocol version 2025-11-25, Streamable HTTP, seven tools. Every chip on screen is a real tool call, made by an OpenAI model."
speak = "Behind the screen is a self-hosted M C P server: protocol version twenty twenty-five, eleven, twenty-five, Streamable H T T P, seven tools. Every chip on screen is a real tool call, made by an Open A I model."
focus = "#trace"

[[shot]]
url = "/?mute=1&tall=1"
say = "This is a simulated smart display in a browser, not an Alexa+ device. The questions here were entered from the page address. The microphone and spoken replies were not tested for this recording, and this narration is a synthetic voice."
speak = "This is a simulated smart display in a browser, not an Alexa plus device. The questions here were entered from the page address. The microphone and spoken replies were not tested for this recording, and this narration is a synthetic voice."
focus = ".dock"

[[shot]]
url = "/?mute=1&tall=1"
say = "Checks run on demand, and the linked notice is always the final word. Recall Radar runs with one command, and needs no key for its data."
